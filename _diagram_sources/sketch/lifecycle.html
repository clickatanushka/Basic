<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Nunito; src: url(Nunito.ttf); font-weight: 200 1000; }
html, body { margin: 0; background: #fff; }
svg { display: block; font-family: Nunito, sans-serif; }
</style>
<script src="rough.js"></script>
</head><body>
<svg id="s" width="2400" height="960" viewBox="0 0 2400 960"></svg>
<script>
const svg = document.getElementById('s');
const rc = rough.svg(svg);
let seed = 7;
const o = (x = {}) => Object.assign({ roughness: 1.3, bowing: 1.2, strokeWidth: 3.5, seed: seed++ }, x);
const add = n => (svg.appendChild(n), n);
const INK = '#2B2F3A', MUTED = '#5A6474';
const C = { blue: '#4E79C4', purple: '#9A6FB0', teal: '#23998A', orange: '#E8962A', coral: '#E0624B', green: '#5FA347' };
const T = { blue: '#E4ECF9', purple: '#F1E8F6', teal: '#DDF3EF', orange: '#FDEFD9', coral: '#FCE4DE', green: '#E6F3DF' };

function text(x, y, s, size = 30, color = INK, weight = 700, anchor = 'middle', rot = 0) {
  const lines = s.split('\n');
  lines.forEach((l, i) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', x); t.setAttribute('y', y + i * size * 1.22);
    t.setAttribute('font-size', size); t.setAttribute('fill', color); t.setAttribute('font-weight', weight);
    t.setAttribute('text-anchor', anchor); t.setAttribute('dominant-baseline', 'middle');
    if (rot) t.setAttribute('transform', `rotate(${rot} ${x} ${y})`);
    t.textContent = l; add(t);
  });
}
const line = (x1, y1, x2, y2, c = INK, w = 3.5, extra = {}) => add(rc.line(x1, y1, x2, y2, o({ stroke: c, strokeWidth: w, ...extra })));
function arrowHead(x, y, ang, c = INK, size = 22) {
  const a1 = ang + Math.PI * 0.82, a2 = ang - Math.PI * 0.82;
  line(x, y, x + size * Math.cos(a1), y + size * Math.sin(a1), c, 4, { roughness: 0.6 });
  line(x, y, x + size * Math.cos(a2), y + size * Math.sin(a2), c, 4, { roughness: 0.6 });
}
function curveArrow(pts, c = INK, w = 4) {
  add(rc.curve(pts, o({ stroke: c, strokeWidth: w, roughness: 0.9 })));
  const [p, q] = [pts[pts.length - 2], pts[pts.length - 1]];
  arrowHead(q[0], q[1], Math.atan2(q[1] - p[1], q[0] - p[0]), c);
}

// ---------- layout ----------
const xs = [330, 690, 1050, 1410, 1770, 2130];
const cy = 330, R = 98;
const steps = [
  ['Collect', 'blue', 'Priya orders\nshoes in the\nShopKart app'],
  ['Store', 'purple', 'the order is\nsaved in the\norders table'],
  ['Clean', 'teal', '"Bombay" and\n"Mumbai" are\nthe same city!'],
  ['Analyse', 'orange', 'which city\nreturns the\nmost orders?'],
  ['Model', 'coral', 'guess which\nnew orders will\ncome back'],
  ['Communicate', 'green', 'show the\nmanagers a\ndashboard'],
];

// ---------- the loop back (top) ----------
add(rc.path(`M ${xs[5]} ${cy - R - 10} C ${xs[5] + 20} 40, ${xs[5] - 300} 34, 1200 34`, o({ stroke: C.coral, strokeWidth: 4, roughness: 0.8, strokeLineDash: [16, 12] })));
add(rc.path(`M 1200 34 C ${xs[0] + 300} 34, ${xs[0] - 20} 40, ${xs[0]} ${cy - R - 14}`, o({ stroke: C.coral, strokeWidth: 4, roughness: 0.8, strokeLineDash: [16, 12] })));
arrowHead(xs[0], cy - R - 14, Math.PI / 2 + 0.15, C.coral, 26);
text(1230, 92, 'The manager decides something (like a faster courier)', 32, C.coral, 800);
text(1230, 134, '… that creates NEW data, and the journey starts again!', 29, C.coral, 700);

// ---------- stations ----------
steps.forEach(([name, col, eg], i) => {
  const x = xs[i];
  add(rc.circle(x, cy, R * 2, o({ stroke: C[col], fill: T[col], fillStyle: 'solid', strokeWidth: 4 })));
  // number badge
  add(rc.circle(x - R * 0.78, cy - R * 0.78, 54, o({ stroke: C[col], fill: C[col], fillStyle: 'solid', strokeWidth: 3, roughness: 0.8 })));
  text(x - R * 0.78, cy - R * 0.78 + 2, String(i + 1), 32, '#fff', 900);
  text(x, cy + R + 38, name, 38, INK, 900);
  // sticky note with the ShopKart example
  const rot = [-2.5, 2, -1.5, 2.5, -2, 1.5][i];
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('transform', `rotate(${rot} ${x} ${560})`);
  g.appendChild(rc.rectangle(x - 128, 490, 256, 142, o({ stroke: '#E2C044', fill: '#FFF4B8', fillStyle: 'solid', strokeWidth: 2, roughness: 0.7 })));
  add(g);
  const tl = eg.split('\n');
  text(x, 561 - (tl.length - 1) * 16, eg, 26, '#4A4220', 700, 'middle', rot);
  if (i < 5) curveArrow([[x + R + 14, cy + 6], [(x + xs[i + 1]) / 2, cy - 22], [xs[i + 1] - R - 18, cy + 4]], INK, 4);
});

// ---------- icons ----------
// 1 Collect: phone with a cart
(() => { const x = xs[0], y = cy;
  add(rc.rectangle(x - 36, y - 60, 72, 120, o({ stroke: INK, fill: '#fff', fillStyle: 'solid', strokeWidth: 3.5 })));
  line(x - 10, y + 48, x + 10, y + 48, INK, 3);
  add(rc.rectangle(x - 20, y - 22, 40, 28, o({ stroke: C.blue, strokeWidth: 3 })));         // cart basket
  line(x - 28, y - 30, x - 20, y - 22, C.blue, 3);
  add(rc.circle(x - 12, y + 14, 9, o({ stroke: C.blue, strokeWidth: 3 })));
  add(rc.circle(x + 12, y + 14, 9, o({ stroke: C.blue, strokeWidth: 3 })));
  text(x, y - 42, 'BUY', 16, C.blue, 900);
})();
// 2 Store: database cylinder
(() => { const x = xs[1], y = cy, w = 104;
  add(rc.path(`M ${x - w / 2} ${y - 42} L ${x - w / 2} ${y + 44} A ${w / 2} 16 0 0 0 ${x + w / 2} ${y + 44} L ${x + w / 2} ${y - 42}`, o({ stroke: INK, fill: '#fff', fillStyle: 'solid' })));
  add(rc.ellipse(x, y - 42, w, 32, o({ stroke: INK, fill: '#fff', fillStyle: 'solid' })));
  add(rc.path(`M ${x - w / 2} ${y - 8} A ${w / 2} 16 0 0 0 ${x + w / 2} ${y - 8}`, o({ stroke: C.purple })));
  add(rc.path(`M ${x - w / 2} ${y + 20} A ${w / 2} 16 0 0 0 ${x + w / 2} ${y + 20}`, o({ stroke: C.purple })));
})();
// 3 Clean: broom + sparkles
(() => { const x = xs[2], y = cy;
  line(x + 40, y - 62, x - 6, y + 14, '#8B5E34', 6);
  add(rc.polygon([[x - 22, y + 4], [x + 12, y + 24], [x - 14, y + 66], [x - 58, y + 40]], o({ stroke: '#B58A2C', fill: '#F3D27A', fillStyle: 'hachure', hachureGap: 7, strokeWidth: 3 })));
  const star = (sx, sy, r) => { line(sx - r, sy, sx + r, sy, C.teal, 3); line(sx, sy - r, sx, sy + r, C.teal, 3); };
  star(x + 42, y + 30, 13); star(x + 58, y - 6, 9); star(x - 52, y - 36, 11);
})();
// 4 Analyse: bar chart under a magnifying glass
(() => { const x = xs[3], y = cy;
  [[-50, 30], [-24, 55], [2, 20], [28, 70]].forEach(([dx, h], k) =>
    add(rc.rectangle(x + dx - 4, y + 52 - h, 22, h, o({ stroke: INK, fill: k === 3 ? C.orange : '#fff', fillStyle: 'solid', strokeWidth: 2.5 }))));
  line(x - 62, y + 54, x + 60, y + 54, INK, 3);
  add(rc.circle(x + 28, y - 30, 64, o({ stroke: INK, strokeWidth: 5 })));
  line(x + 50, y - 8, x + 72, y + 16, INK, 7);
})();
// 5 Model: crystal ball
(() => { const x = xs[4], y = cy;
  add(rc.circle(x, y - 12, 108, o({ stroke: INK, fill: '#fff', fillStyle: 'solid', strokeWidth: 3.5 })));
  add(rc.polygon([[x - 40, y + 66], [x + 40, y + 66], [x + 26, y + 40], [x - 26, y + 40]], o({ stroke: INK, fill: C.coral, fillStyle: 'solid', strokeWidth: 3 })));
  text(x + 2, y - 10, '?', 56, C.coral, 900);
  add(rc.arc(x, y - 12, 80, 80, Math.PI * 1.05, Math.PI * 1.4, false, o({ stroke: '#B9C0CC', strokeWidth: 4 })));
})();
// 6 Communicate: easel with a rising chart
(() => { const x = xs[5], y = cy;
  add(rc.rectangle(x - 58, y - 56, 116, 82, o({ stroke: INK, fill: '#fff', fillStyle: 'solid', strokeWidth: 3.5 })));
  line(x - 20, y + 26, x - 40, y + 68, INK, 3.5); line(x + 20, y + 26, x + 40, y + 68, INK, 3.5);
  add(rc.linearPath([[x - 44, y + 10], [x - 18, y - 10], [x + 4, y + 0], [x + 40, y - 38]], o({ stroke: C.green, strokeWidth: 5 })));
  arrowHead(x + 40, y - 38, -0.8, C.green, 16);
})();

// ---------- who does what: highlighter lanes ----------
function stick(x, y, c) {
  add(rc.circle(x, y - 26, 26, o({ stroke: c, strokeWidth: 3.5 })));
  line(x, y - 13, x, y + 14, c, 3.5);
  line(x - 15, y - 2, x + 15, y - 2, c, 3.5);
  line(x, y + 14, x - 11, y + 32, c, 3.5); line(x, y + 14, x + 11, y + 32, c, 3.5);
}
const lanes = [
  ['Engineer', 'blue', [[0, 2]]],
  ['Analyst', 'teal', [[2, 3], [5, 5]]],
  ['Scientist', 'purple', [[3, 5]]],
];
lanes.forEach(([who, col, spans], k) => {
  const y = 712 + k * 82;
  stick(48, y, C[col]);
  text(78, y + 2, who, 31, C[col], 900, 'start');
  spans.forEach(([a, b]) => {
    const x1 = xs[a] - 95, x2 = xs[b] + 95;
    add(rc.rectangle(x1, y - 22, x2 - x1, 44, o({ stroke: 'none', fill: T[col], fillStyle: 'solid', roughness: 1.8 })));
    add(rc.line(x1 + 6, y + 18, x2 - 6, y + 18, o({ stroke: C[col], strokeWidth: 5, roughness: 1 })));
    for (let i = a; i <= b; i++) text(xs[i], y - 2, steps[i][0], 25, C[col], 800);
  });
});
// everyone's job
add(rc.ellipse(xs[2], 753, 230, 160, o({ stroke: C.coral, strokeWidth: 3, roughness: 1.6 })));
add(rc.ellipse(xs[5], 835, 270, 160, o({ stroke: C.coral, strokeWidth: 3, roughness: 1.6 })));
text(240, 900, '★ Cleaning and communicating = everybody\'s job!', 29, C.coral, 800, 'start');
</script>
</body></html>
